[workspace]
resolver = "2"
members = [
    "crates/tva-core",
    "crates/tva-macos",
    "crates/tva-agent",
    "crates/tva-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
async-channel = "2"
parking_lot = "0.12"
once_cell = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# macOS 平台层
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-av-foundation = "0.3"
objc2-speech = "0.3"
block2 = "0.6"

# UI
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# 全局快捷键
global-hotkey = "0.7"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
